name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test with coverage (Asia/Bangkok)
        run: pnpm test:coverage
        env:
          TZ: Asia/Bangkok
      - name: Test in UTC-8, UTC+14 and a midnight-DST zone (off-by-one guard)
        run: |
          TZ=America/Los_Angeles pnpm test
          TZ=Pacific/Kiritimati pnpm test
          TZ=America/Santiago pnpm test
      - run: pnpm build
      - run: pnpm check:exports
      - name: Bundle size budget
        run: |
          pnpm size
          echo '### Bundle sizes (gzip)' >> "$GITHUB_STEP_SUMMARY"
          pnpm -s size-limit --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const r of JSON.parse(s))console.log(`- ${r.name}: ${(r.size/1024).toFixed(2)} kB`)})' >> "$GITHUB_STEP_SUMMARY"

  storybook:
    name: Storybook interaction + a11y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build-storybook --quiet
      - name: Run test-runner against static build
        run: |
          pnpm exec concurrently -k -s first -n SB,TEST \
            "pnpm exec http-server storybook-static --port 6006 --silent" \
            "pnpm exec wait-on tcp:127.0.0.1:6006 && pnpm test-storybook --url http://127.0.0.1:6006"

  examples:
    name: Fresh Vite + Next.js install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm examples:verify
